name: Selenium test logging evidence

on:
  push:
    branches: [main]
    paths:
      - "test_portfolio.py"
      - "requirements.txt"
      - ".github/workflows/test-logging.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-commit-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Selenium checks three times
        run: |
          for run in 1 2 3; do
            python test_portfolio.py
            sleep 2
          done

      - name: Commit generated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No new log evidence to commit."
          else
            git commit -m "Add generated Selenium test logs"
            git push origin HEAD:main
          fi
